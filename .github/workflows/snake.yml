# Builds the contribution animations shown in README.md and publishes them to the `output` branch:
#   - a snake that eats my contribution grid (Platane/snk)
#   - a 3D contribution calendar (yoshi389111/github-profile-3d-contrib)
#   - the GitHub stats cards (scripts/build_stats.py): made right here from GitHub's own API with this
#     workflow's built-in token - free, no personal token, no outside stats service that can break
# Runs every 12 hours, on every push to main, and on demand (Actions tab -> Run workflow).
name: Contribution animations

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Snake eating the contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect the images
        run: |
          mkdir -p dist/profile-3d-contrib
          cp profile-3d-contrib/*.svg dist/profile-3d-contrib/
          ls -la dist dist/profile-3d-contrib

      - name: Keep the last stats cards (used if GitHub's API has a hiccup)
        run: |
          mkdir -p dist/stats
          if git fetch --depth=1 origin output 2>/dev/null; then
            git --work-tree=dist checkout FETCH_HEAD -- stats 2>/dev/null || true
            git reset -q
          fi

      - name: GitHub stats cards
        run: python3 scripts/build_stats.py --user "$USERNAME" --out dist/stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
